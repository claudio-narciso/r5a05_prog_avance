services:
  mysql:
    image: mysql:8.4
    container_name: mysql-dev
    restart: unless-stopped
    environment:
      - 'MYSQL_DATABASE=sportmanage'
      - 'MYSQL_USER=claudio'
      - 'MYSQL_PASSWORD=claudio'
      - 'MYSQL_ROOT_PASSWORD=claudio'
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pclaudio"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: